# Monthly Zoho Books <- Shopify item image sync. Draft, not deployed.
# Credentials come only from GitHub Secrets. Default run is a dry run.
name: monthly-image-sync

on:
  schedule:
    - cron: "0 5 1 * *"   # 05:00 UTC on the 1st of each month (06:00 UK in summer). Single day-of-month field: POSIX cron ORs day-of-month and day-of-week, so do not combine them.
  workflow_dispatch:
    inputs:
      apply:
        description: "Write images to Zoho (leave off for dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
      ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      REPORT_DIR: reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sync
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python sync_images.py --apply
          else
            python sync_images.py
          fi
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-sync-reports
          path: reports/
          retention-days: 400
